name: Unit Tests

on:
    push:
        paths:
            - '**.php'
            - '**.json'
            - '**.lock'
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: unit-tests-${{ github.ref }}
    cancel-in-progress: true

jobs:
    unit:
        name: Run Unit Tests
        runs-on: ubuntu-latest
        timeout-minutes: 15
        env:
            APP_NAME: LANager
            APP_KEY: ${{ secrets.APP_KEY }}
            APP_URL: http://localhost:8000
            APP_ENV: testing
            APP_TIMEZONE: UTC
            APP_LOCALE: en
            APP_DEBUG: true
            STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
            DB_CONNECTION: mysql
            DB_HOST: 127.0.0.1
            DB_PORT: 3306
            DB_DATABASE: lanager
            DB_USERNAME: root
            DB_PASSWORD: root
            CACHE_STORE: array
            SESSION_DRIVER: array
            QUEUE_CONNECTION: sync
            MAIL_MAILER: array
            LOG_CHANNEL: file

        services:
            mysql:
                image: mysql:8.4
                env:
                    MYSQL_ROOT_PASSWORD: root
                    MYSQL_DATABASE: lanager
                ports:
                    - 3306:3306
                options: >-
                    --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
                    --health-interval=10s
                    --health-timeout=5s
                    --health-retries=5

        steps:
            -   name: Checkout code
                uses: actions/checkout@v7

            -   name: Set up PHP
                uses: shivammathur/setup-php@v2
                with:
                    php-version: '8.4'
                    extensions: xmlwriter, zip, pdo, pdo_mysql, tokenizer, simplexml, bcmath, fileinfo
                    ini-values: error_reporting=22527
                    coverage: none

            -   name: Install Composer dependencies
                run: composer install --optimize-autoloader --no-interaction --no-progress --no-scripts

            -   name: Create empty .env file
                run: touch .env

            -   name: Run database migrations
                run: php artisan migrate

            -   name: Run Unit tests
                run: php artisan test --testsuite=Unit
